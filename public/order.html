<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب شراء | Sparkle 3D</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/feature-links.css?v=2"><link rel="icon" type="image/jpeg" href="/assets/sparkle-logo.jpg"></head><body><header class="compact-brand-header"><a class="brand-link" href="/" aria-label="Sparkle 3D — الرئيسية"><img class="brand-logo" src="/assets/sparkle-logo.jpg" alt="Sparkle 3D" width="1118" height="1536" fetchpriority="high"></a><nav aria-label="التنقل"><a href="/">العودة للنماذج</a></nav></header><main class="order"><h2>طلب شراء وتسعير</h2><h3 id="product" dir="auto"></h3><p>أدخل بياناتك لنرسل لك الكلفة ومدة التسليم عبر واتساب لاحقًا. لا يوجد دفع الآن؛ تأكيد التنفيذ بعد مراجعة النموذج والتفاصيل.</p><form id="orderForm"><label>الاسم<input name="name" required maxlength="80" autocomplete="name"></label><label>العنوان<textarea name="address" required maxlength="400" autocomplete="street-address" placeholder="المدينة، الحي، الشارع"></textarea></label><label>رقم واتساب مع رمز البلد<input name="phone" required type="tel" dir="ltr" maxlength="22" placeholder="+963…" autocomplete="tel"></label><label>الكمية<input name="quantity" type="number" min="1" max="1000" value="1" required></label><label>ملاحظات: الحجم واللون المطلوب<textarea name="notes" maxlength="500"></textarea></label><p>ستُضمّن هذه البيانات في رسالة واتساب إلى المتجر، وتُحفظ في حسابك إذا كنت مسجل الدخول. اضغط «إرسال» داخل واتساب لإتمام الطلب.</p><button id="send" type="submit">متابعة الطلب عبر واتساب</button><p id="orderStatus" role="status"></p></form></main><script src="/client.js"></script><script src="/order.js?v=accounts1"></script></body></html>
