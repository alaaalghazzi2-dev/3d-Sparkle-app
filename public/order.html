<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب شراء | Sparkle 3D</title><link rel="stylesheet" href="/style.css"></head><body><header><h1 dir="ltr">Sparkle <span>3D</span></h1><a href="/">العودة للنماذج</a></header><main class="order"><h2>طلب شراء وتسعير</h2><h3 id="product" dir="auto"></h3><p>أدخل بياناتك لنرسل لك الكلفة ومدة التسليم عبر واتساب لاحقًا. لا يوجد دفع الآن؛ تأكيد التنفيذ بعد مراجعة النموذج والتفاصيل.</p><form id="orderForm"><label>الاسم<input name="name" required maxlength="80" autocomplete="name"></label><label>العنوان<textarea name="address" required maxlength="400" autocomplete="street-address" placeholder="المدينة، الحي، الشارع"></textarea></label><label>رقم واتساب مع رمز البلد<input name="phone" required type="tel" dir="ltr" maxlength="22" placeholder="+963…" autocomplete="tel"></label><label>الكمية<input name="quantity" type="number" min="1" max="1000" value="1" required></label><label>ملاحظات: الحجم واللون المطلوب<textarea name="notes" maxlength="500"></textarea></label><p>ستُضمّن هذه البيانات في رسالة واتساب إلى المتجر، ولا تُحفظ في الموقع. اضغط «إرسال» داخل واتساب لإتمام الطلب.</p><button id="send" type="submit">متابعة الطلب عبر واتساب</button><p id="orderStatus" role="status"></p></form></main><script src="/shop-config.js"></script><script src="/order.js"></script></body></html>
