<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | Sparkle 3D</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/jpeg" href="/assets/sparkle-logo.jpg"></head><body><header class="compact-brand-header"><a class="brand-link" href="/" aria-label="Sparkle 3D — الرئيسية"><img class="brand-logo" src="/assets/sparkle-logo.jpg" alt="Sparkle 3D" width="1118" height="1536" fetchpriority="high"></a><nav id="accountNav"><a href="/">النماذج</a><a href="/custom.html">من خيالك… نصنعها</a></nav></header><main class="account"><p id="feedback" role="status"></p><section id="auth"><h2>دخول العملاء والمسؤول</h2><form id="login"><label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button>دخول</button></form><button id="forgot" class="secondary">نسيت كلمة المرور</button><details><summary>إنشاء حساب جديد</summary><form id="signup"><label>الاسم<input name="name" maxlength="100" required autocomplete="name"></label><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>رقم واتساب<input name="phone" type="tel" maxlength="30" required autocomplete="tel"></label><label>العنوان<textarea name="address" maxlength="500" required autocomplete="street-address"></textarea></label><label>كلمة المرور (10 أحرف على الأقل)<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label class="check"><input name="offers" type="checkbox">أرغب باستقبال العروض وفرص الربح داخل حسابي، ويمكنني إيقافها لاحقًا.</label><p>نحفظ الاسم ورقم التواصل والعنوان لتقديم الخدمة. لا تظهر بياناتك للعملاء الآخرين.</p><button>إنشاء حساب</button></form></details></section><section id="member" hidden><h2>بيانات حسابي</h2><form id="profile"><label>الاسم<input name="name" maxlength="100" required></label><label>واتساب<input name="phone" maxlength="30" required></label><label>العنوان<textarea name="address" maxlength="500" required></textarea></label><label class="check"><input name="marketing_opt_in" type="checkbox">استقبال العروض وفرص الربح</label><button>حفظ بياناتي</button></form><button id="logout" class="secondary">تسجيل الخروج</button><h2>رسائلي</h2><div id="messages"></div><h2>طلبات التسعير</h2><div id="orders"></div><h2>طلبات أفكاري — آخر 100 طلب</h2><div id="myCustomRequests"></div></section><section id="recovery" hidden><h2>تعيين كلمة مرور جديدة</h2><form id="reset"><input aria-label="كلمة المرور الجديدة" name="password" type="password" minlength="10" required autocomplete="new-password"><button>حفظ كلمة المرور</button></form></section></main><script src="/client.js"></script><script src="/custom-list.js"></script><script src="/account.js?v=custom1"></script></body></html>
